name: pirate-battle

x-app: &app
  build: .
  image: pirate-battle
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  init: true
  ipc: host
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - pnpm_store:/pnpm/store

services:
  app:
    <<: *app
    profiles: [tools]

  preview:
    <<: *app
    command: sh -c "pnpm build && pnpm preview --host"
    ports:
      - "127.0.0.1:4173:4173"

volumes:
  node_modules:
  pnpm_store:
