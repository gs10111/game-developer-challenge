name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run the container as the runner user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the image
        run: docker compose build app

      - name: Lint
        run: docker compose run --rm app pnpm lint

      - name: Typecheck
        run: docker compose run --rm app pnpm typecheck

      - name: Unit tests
        run: docker compose run --rm app pnpm test

      - name: E2E tests
        run: docker compose run --rm app pnpm test:e2e

      - name: Upload the Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
